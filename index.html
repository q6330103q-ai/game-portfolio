        <p class="noscript__lede">작품을 고르고 큰 화면으로 보려면 JavaScript가 필요합니다. 스크립트 없이도 최종 프로젝트 세 편의 대표 영상은 아래 링크로 열 수 있습니다.</p>
        <ul class="noscript__list">
          <li><strong>NECRO CLIMB</strong> 망자의 군단을 세워 인간의 성채를 오르는 세로형 강령술사 기지전. <a href="media/necro-guardian.mp4">수호자 강림 · v1.9 Windows 빌드 직접 플레이 녹화</a></li>
          <li><strong>한빛 감독 축구</strong> 필살기가 터지는 11 대 11, 나는 감독이다. <a href="media/hanbit-clash.mp4">골키퍼 격돌 · 실제 경기 캡처 13장을 이은 연속 프레임(실시간 녹화 아님)</a></li>
          <li><strong>말랑이 보호소</strong> 경계하는 모찌와 천천히 친해지는 힐링 돌봄. <a href="media/mallang-snack.mp4">간식 찾기 · 자동 테스트가 가상 터치로 조작한 직접 실행 녹화</a></li>
